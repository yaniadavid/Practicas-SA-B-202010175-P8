{{- if .Values.cronjobs.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-execution-cronjob
  namespace: {{ .Values.namespace.name | quote }}
spec:
  schedule: {{ .Values.cronjobs.audit.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: audit-execution-cronjob
        spec:
          serviceAccountName: audit-execution-cronjob
          restartPolicy: OnFailure
          containers:
            - name: audit-execution
              image: python:3.12-slim
              imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pip install --no-cache-dir psycopg2-binary >/dev/null 2>&1 && \
                  sh /opt/cronjobs/cronjob1_audit_execution.sh
              envFrom:
                - configMapRef:
                    name: sa-platform-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default "sa-platform-secret" .Values.secrets.name | quote }}
                      key: postgres-password
              volumeMounts:
                - name: cronjob-scripts
                  mountPath: /opt/cronjobs
                  readOnly: true
          volumes:
            - name: cronjob-scripts
              configMap:
                name: sa-platform-cronjob-scripts
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-summary-cronjob
  namespace: {{ .Values.namespace.name | quote }}
spec:
  schedule: {{ .Values.cronjobs.summary.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/component: audit-summary-cronjob
        spec:
          serviceAccountName: audit-summary-cronjob
          restartPolicy: OnFailure
          containers:
            - name: audit-summary
              image: python:3.12-slim
              imagePullPolicy: {{ .Values.global.imagePullPolicy | quote }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  pip install --no-cache-dir psycopg2-binary pika >/dev/null 2>&1 && \
                  sh /opt/cronjobs/cronjob2_audit_summary.sh
              envFrom:
                - configMapRef:
                    name: sa-platform-config
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default "sa-platform-secret" .Values.secrets.name | quote }}
                      key: postgres-password
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ default "sa-platform-secret" .Values.secrets.name | quote }}
                      key: rabbitmq-password
              volumeMounts:
                - name: cronjob-scripts
                  mountPath: /opt/cronjobs
                  readOnly: true
          volumes:
            - name: cronjob-scripts
              configMap:
                name: sa-platform-cronjob-scripts
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-execution-cronjob
  namespace: {{ .Values.namespace.name | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-summary-cronjob
  namespace: {{ .Values.namespace.name | quote }}
{{- end }}
