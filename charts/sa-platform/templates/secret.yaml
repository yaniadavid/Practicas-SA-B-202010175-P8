{{- if ne .Values.secrets.create false }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default "sa-platform-secret" .Values.secrets.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  SUPABASE_URL: {{ required "secrets.supabaseUrl is required. Use values.example.yaml as a template." .Values.secrets.supabaseUrl | quote }}
  SUPABASE_SERVICE_ROLE_KEY: {{ required "secrets.supabaseServiceRoleKey is required" .Values.secrets.supabaseServiceRoleKey | quote }}
  AES_SECRET_KEY: {{ required "secrets.aesSecretKey is required" .Values.secrets.aesSecretKey | quote }}
  EMAIL_HASH_SECRET: {{ required "secrets.emailHashSecret is required" .Values.secrets.emailHashSecret | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  rabbitmq-password: {{ required "secrets.rabbitmqPassword is required" .Values.secrets.rabbitmqPassword | quote }}
{{- end }}
