apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sa-platform
  namespace: sa-p8
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-p9
    kind: ClusterSecretStore
  target:
    name: sa-platform-secret
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: p9/sa-platform
        property: postgres-password
    - secretKey: appointments-write-token
      remoteRef:
        key: p9/sa-platform
        property: appointments-write-token
