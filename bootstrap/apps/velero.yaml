apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.2.1
      helm:
        releaseName: velero
        valueFiles:
          - $values/apps/velero/values.yaml
    - repoURL: https://github.com/yaniadavid/Practicas-SA-B-202010175-P8.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
