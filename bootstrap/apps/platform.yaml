apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: p9-platform-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/yaniadavid/Practicas-SA-B-202010175-P8.git
    targetRevision: main
    path: argocd
    directory:
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
